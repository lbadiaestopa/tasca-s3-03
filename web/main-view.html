<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./stylesheets/output.css" rel="stylesheet">
</head>
<body>
    <header class="px-18 py-11 flex justify-between items-center">
        <button class="group bg-primary font-inter text-4xl font-extrabold py-4 px-6 rounded-full border-black border-4 cursor-pointer flex items-center justify-center gap-3">
            <svg class="w-6 h-6 inline-block transition-transform duration-300 group-hover:rotate-90" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 1H6V6L1 6V10H6V15H10V10H15V6L10 6V1Z" />
            </svg>
            NEW TASK
        </button>
        <div class="flex gap-5">
        <button class="group relative w-12 h-12 bg-all rounded-full border-black border-3 flex items-center justify-center overflow-hidden transition-all duration-300 hover:w-20">
        <span class="absolute left-5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap font-inter font-bold text-white">
            ALL
        </span>
        </button>
        <button class="group relative w-12 h-12 bg-pending rounded-full border-black border-3 flex items-center justify-center overflow-hidden transition-all duration-300 hover:w-30">
        <span class="absolute left-5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap font-inter font-bold text-white">
            PENDING
        </span>
        </button>
        <button class="group relative w-12 h-12 bg-progress rounded-full border-black border-3 flex items-center justify-center overflow-hidden transition-all duration-300 hover:w-38">
        <span class="absolute left-5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap font-inter font-bold">
            IN PROGRESS
        </span>
        </button>
        <button class="group relative w-12 h-12 bg-primary rounded-full border-black border-3 flex items-center justify-center overflow-hidden transition-all duration-300 hover:w-36">
        <span class="absolute left-5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap font-inter font-bold">
            COMPLETED
        </span>
        </button>
        </div>
        <button class="bg-primary font-inter text-4xl font-extrabold min-w-20 min-h-20 w-20 h-20 rounded-full border-black border-4 cursor-pointer transition-transform duration-300 hover:rotate-12">
            L
        </button>
    </header>
</body>
</html>
